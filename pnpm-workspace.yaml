packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24
  "@electric-sql/pglite": ^0.5.3
  alchemy: 2.0.0-beta.57
  effect: 4.0.0-beta.84
  "@effect/platform-bun": 4.0.0-beta.84
  "@effect/platform-node": 4.0.0-beta.84
  tslib: ^2.8.1
  "@vitest/coverage-v8": 4.1.9
  pkg-pr-new: ^0.0.75
  "@changesets/cli": ^3.0.0
  "@tanstack/markdown": ^0.0.13
  "@tanstack/highlight": ^0.0.10
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    "@distilled.cloud/cloudflare": "*"
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  msgpackr-extract: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - "@distilled.cloud/aws@0.26.1"
  - "@distilled.cloud/axiom@0.26.1"
  - "@distilled.cloud/cloudflare@0.26.1"
  - "@distilled.cloud/core@0.26.1"
  - "@distilled.cloud/neon@0.26.1"
  - "@distilled.cloud/planetscale@0.26.1"
  - alchemy@2.0.0-beta.57
  - '@prisma/orm-family-sql@8.0.0-rc.1'
  - '@prisma/orm-framework@8.0.0-rc.1'
  - '@prisma/orm-postgres@8.0.0-rc.1'
  - '@prisma/orm-target-postgres@8.0.0-rc.1'
  - '@prisma/orm-toolchain@8.0.0-rc.1'
  - prisma-next@8.0.0-rc.1
  - '@prisma/orm-family-sql@8.0.0-rc.2'
  - '@prisma/orm-framework@8.0.0-rc.2'
  - '@prisma/orm-postgres@8.0.0-rc.2'
  - '@prisma/orm-target-postgres@8.0.0-rc.2'
  - '@prisma/orm-toolchain@8.0.0-rc.2'
  - '@prisma/cli-engine@0.1.1'
  - '@prisma/orm-family-sql@8.0.0-rc.3'
  - '@prisma/orm-framework@8.0.0-rc.3'
  - '@prisma/orm-postgres@8.0.0-rc.3'
  - '@prisma/orm-target-postgres@8.0.0-rc.3'
  - '@prisma/orm-toolchain@8.0.0-rc.3'
  - '@prisma/cli-engine@0.2.0'
  - '@prisma/orm-family-sql@8.0.0-rc.4'
  - '@prisma/orm-framework@8.0.0-rc.4'
  - '@prisma/orm-postgres@8.0.0-rc.4'
  - '@prisma/orm-target-postgres@8.0.0-rc.4'
  - '@prisma/orm-toolchain@8.0.0-rc.4'
  - prisma@8.0.0-rc.6
  - '@changesets/apply-release-plan@8.0.0'
  - '@changesets/assemble-release-plan@7.0.0'
  - '@changesets/changelog-git@1.0.0'
  - '@changesets/cli@3.0.0'
  - '@changesets/config@4.0.0'
  - '@changesets/errors@1.0.0'
