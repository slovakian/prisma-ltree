packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24
  "@electric-sql/pglite": ^0.5.3
  alchemy: 2.0.0-beta.57
  effect: 4.0.0-beta.84
  "@effect/platform-bun": 4.0.0-beta.84
  "@effect/platform-node": 4.0.0-beta.84
  tslib: ^2.8.1
  "@vitest/coverage-v8": 4.1.9
  pkg-pr-new: ^0.0.75
  "@changesets/cli": ^3.0.0
  "@tanstack/markdown": ^0.0.13
  "@tanstack/highlight": ^0.0.10
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    "@distilled.cloud/cloudflare": "*"
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  msgpackr-extract: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  # One line per package. pnpm uses only the first version list for a name.
  - "@distilled.cloud/aws@0.26.1"
  - "@distilled.cloud/axiom@0.26.1"
  - "@distilled.cloud/cloudflare@0.26.1"
  - "@distilled.cloud/core@0.26.1"
  - "@distilled.cloud/neon@0.26.1"
  - "@distilled.cloud/planetscale@0.26.1"
  - "alchemy@2.0.0-beta.57"
  - "@prisma/orm-family-sql@8.0.0-rc.1 || 8.0.0-rc.2 || 8.0.0-rc.3 || 8.0.0-rc.4 || 8.0.0-rc.5 || 8.0.0-rc.6 || 8.0.0-rc.7 || 8.0.0-rc.8 || 8.0.0-rc.15 || 8.0.0-rc.16"
  - "@prisma/orm-framework@8.0.0-rc.1 || 8.0.0-rc.2 || 8.0.0-rc.3 || 8.0.0-rc.4 || 8.0.0-rc.5 || 8.0.0-rc.6 || 8.0.0-rc.7 || 8.0.0-rc.8 || 8.0.0-rc.15 || 8.0.0-rc.16"
  - "@prisma/orm-postgres@8.0.0-rc.1 || 8.0.0-rc.2 || 8.0.0-rc.3 || 8.0.0-rc.4 || 8.0.0-rc.5 || 8.0.0-rc.6 || 8.0.0-rc.7 || 8.0.0-rc.8 || 8.0.0-rc.15 || 8.0.0-rc.16"
  - "@prisma/orm-target-postgres@8.0.0-rc.1 || 8.0.0-rc.2 || 8.0.0-rc.3 || 8.0.0-rc.4 || 8.0.0-rc.5 || 8.0.0-rc.6 || 8.0.0-rc.7 || 8.0.0-rc.8 || 8.0.0-rc.15 || 8.0.0-rc.16"
  - "@prisma/orm-toolchain@8.0.0-rc.1 || 8.0.0-rc.2 || 8.0.0-rc.3 || 8.0.0-rc.4 || 8.0.0-rc.5 || 8.0.0-rc.6 || 8.0.0-rc.7 || 8.0.0-rc.8 || 8.0.0-rc.15 || 8.0.0-rc.16"
  - "prisma-next@8.0.0-rc.1"
  - "@prisma/cli-engine@0.1.1 || 0.2.0 || 0.2.2 || 0.2.3 || 0.3.0 || 0.6.3"
