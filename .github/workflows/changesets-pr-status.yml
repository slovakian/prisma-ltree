name: Changesets PR Status

on:
  pull_request:

permissions: {}

concurrency:
  group: changesets-pr-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-status:
    # Skip fork PRs — commenting needs write access to this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate PR status
        id: pr-status
        uses: changesets/action/pr-status@v2

  pr-comment:
    needs: pr-status
    if: needs.pr-status.outputs.comment-body != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: changesets/action/pr-comment@v2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
