# Standalone project root. This file exists so pnpm treats examples/family-tree
# as its own workspace instead of joining the prisma-ltree monorepo above it.
#
# Monorepo showcase path (default): prisma-ltree is a `file:` dependency on
# ../../packages/extension-ltree. Build the pack first
# (`cd packages/extension-ltree && vp pack`), then `pnpm install` here.
# Prefer `file:` over `link:` so the example does not inherit the pack's
# nested monorepo `node_modules` (dual @prisma/orm-* copies).
#
# Publish-pin path (copy-anywhere): replace the file: dep with
# `"prisma-ltree": "^0.6.0"` (or the latest npm release that matches your
# `@prisma/orm-*` pins) and install from the registry. See README.md.
packages: []
allowBuilds:
  esbuild: true
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - prisma-ltree@0.6.0
  - "@prisma/cli-engine@0.9.0"
  - "@prisma/orm-family-sql@8.0.0-rc.23"
  - "@prisma/orm-framework@8.0.0-rc.23"
  - "@prisma/orm-postgres@8.0.0-rc.23"
  - "@prisma/orm-target-postgres@8.0.0-rc.23"
  - "@prisma/orm-toolchain@8.0.0-rc.23"
  - prisma@8.0.0-rc.33
